name: Cleanup preview environment

on:
  pull_request:
    types: [closed]
  delete:

jobs:
  cleanup:
    if: github.event_name == 'pull_request' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_WORKER_NAME: kino
      CONVEX_MANAGEMENT_TOKEN: ${{ secrets.CONVEX_MANAGEMENT_TOKEN }}
      CONVEX_TEAM_SLUG: ${{ vars.CONVEX_TEAM_SLUG || 'nate-dunn' }}
      CONVEX_PROJECT_SLUG: ${{ vars.CONVEX_PROJECT_SLUG || 'kino' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cleanup needs only the Wrangler CLI (Convex cleanup is plain API calls).
      # Installing the app would build its git-pinned @convex-dev/auth, which
      # --ignore-scripts skips, so its patch fails and the job never runs.
      # Keep this version in sync with wrangler in pnpm-lock.yaml.
      - name: Install Wrangler
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" --no-save --no-audit --no-fund --ignore-scripts wrangler@4.137.0
          echo "$RUNNER_TEMP/tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Resolve preview names
        id: preview
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            branch="${{ github.event.pull_request.head.ref }}"
          else
            branch="${{ github.event.ref }}"
          fi

          convex_preview="$(sh scripts/preview-name.sh "$branch" 48)"
          cloudflare_alias="$(sh scripts/preview-name.sh "$branch" 40)"

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "convex_preview=$convex_preview" >> "$GITHUB_OUTPUT"
          echo "cloudflare_alias=$cloudflare_alias" >> "$GITHUB_OUTPUT"

      - name: Delete Cloudflare Worker Preview
        run: node scripts/cleanup-cloudflare-preview.mjs "${{ steps.preview.outputs.cloudflare_alias }}"

      - name: Delete Convex preview deployment
        run: node scripts/cleanup-convex-preview.mjs "${{ steps.preview.outputs.convex_preview }}"
